# Pipeline stage 4 of 4: promote (the complete pipeline).
# CI for the todo app.
#   Pull request : lint + test + build + scan   (nothing is pushed)
#   Push to main : the above + push image to GHCR + promote the new tag
#                  to the GitOps config repo (Argo CD then deploys it)
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override with a repository variable GITOPS_REPO if your config repo has another name
  GITOPS_REPO: ${{ vars.GITOPS_REPO || format('{0}/todo-gitops', github.repository_owner) }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todo-api" >> "$GITHUB_ENV"

      # Third-party actions are pinned to full commit SHAs (supply-chain safety).
      # The comment shows the release each SHA belongs to.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64) for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (fail on fixable critical CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch so the same image runs on Intel/AMD laptops and Apple Silicon
      - name: Push multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

  promote:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - name: Check the GitOps token exists
        env:
          TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret GITOPS_TOKEN is missing. See README step 4."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Point the config repo at the new image
        run: |
          file=apps/todo/kustomization.yaml
          sed -i "s|newName: .*|newName: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todo-api|" "$file"
          sed -i "s|newTag: .*|newTag: \"${GITHUB_SHA}\"|" "$file"
          if git diff --quiet; then
            echo "Config repo already points at ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "deploy: todo-api ${GITHUB_SHA::7}" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
